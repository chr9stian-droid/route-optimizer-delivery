<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Optimizer Delivery</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>📍 Route Optimizer</h1>
      <p class="subtitle">Planifica entregas y ahorra gasolina</p>

      <section class="card">
        <h2>🏢 Punto de partida</h2>
        <input id="startAddress" type="text" placeholder="Ej: Calle 80 # 10 - 20, Bogotá" />
        <button id="searchStartBtn" class="btn-primary">Buscar en mapa</button>
        <div id="startInfo" class="info-box hidden"></div>
      </section>

      <section class="card">
        <h2>📦 Nueva entrega</h2>
        <input id="clientName" type="text" placeholder="Nombre del cliente" />
        <input id="clientAddress" type="text" placeholder="Dirección del cliente" />
        <input id="product" type="text" placeholder="Producto a entregar" />
        <textarea id="notes" rows="3" placeholder="Notas opcionales"></textarea>
        <button id="addDeliveryBtn" class="btn-success">Agregar entrega</button>
      </section>

      <section class="card">
        <h2>📋 Lista de entregas</h2>
        <div id="deliveriesList" class="deliveries-list">
          <p class="empty">No hay entregas agregadas.</p>
        </div>
      </section>

      <section class="card actions">
        <button id="calculateBtn" class="btn-route" disabled>🚗 Calcular ruta</button>
        <button id="clearAllBtn" class="btn-danger">🗑️ Limpiar todo</button>
      </section>

      <section id="routeResult" class="card hidden">
        <h2>✅ Ruta sugerida</h2>
        <div id="routeSummary"></div>
      </section>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script src="script.js"></script>
</body>
</html>
